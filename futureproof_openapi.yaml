openapi: 3.0.3
info:
  title: FutureProof Retirement Simulator
  version: 1.0.0
  description: >
    Runs the FutureProof Monte Carlo retirement simulation (SAS Job Execution)
    and returns the probability that the user's savings last.
servers:
  - url: https://viya-3tzzrqm1rj.engage.sas.com
paths:
  /SASJobExecution/:
    get:
      operationId: run_retirement_simulation
      summary: Run the FutureProof Monte Carlo retirement simulation
      description: >
        Use this tool whenever the user asks whether their retirement savings
        will last, how likely they are to run out of money, or what happens if
        they withdraw more or less each year. Returns the simulated probability
        of success as JSON. Ask the user for any missing numeric input before
        calling.
      security:
        - bearerAuth: []
      parameters:
        - name: _program
          in: query
          required: true
          description: Fixed SAS job path. Do not change.
          schema:
            type: string
            enum:
              - /Public/FutureProofAgent/FPMC_agenticAI_job_copy
            default: /Public/FutureProofAgent/FPMC_agenticAI_job_copy
        - name: _output_type
          in: query
          required: true
          description: Fixed output format. Do not change.
          schema:
            type: string
            enum: [json]
            default: json
        - name: w0
          in: query
          required: true
          description: Starting portfolio value in dollars (initial wealth).
          schema:
            type: number
            example: 135600
        - name: wd_amount
          in: query
          required: true
          description: Annual withdrawal amount in dollars.
          schema:
            type: number
            example: 41000
        - name: income
          in: query
          required: true
          description: Annual income in dollars.
          schema:
            type: number
            example: 85900
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Missing or expired token
        "403":
          description: Token valid but no permission on the job or folder
        "404":
          description: Job path not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
